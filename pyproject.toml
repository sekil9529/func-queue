[tool.poetry]
name = "func-queue"
version = "0.1"
description = ""
authors = ["liuseki <liuseki@163.com>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
orjson = "*"
pydantic = "^2.14.1"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
priority = "primary"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-html = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

